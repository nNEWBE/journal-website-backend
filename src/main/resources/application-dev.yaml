# =============================================
# DEVELOPMENT PROFILE — H2 In-Memory Database
# =============================================
spring:
  datasource:
    url: jdbc:h2:mem:gbjournal_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop   # Schema is wiped and recreated on every restart
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Disable Docker Compose for dev (no Docker needed)
  docker:
    compose:
      enabled: false

  # =============================================
  # Email SMTP — Brevo (Free: 300 emails/day)
  # https://app.brevo.com -> SMTP & API -> Generate SMTP Key
  # Set env vars before running:
  #   $env:BREVO_SMTP_USER="your-brevo-login-email@example.com"
  #   $env:BREVO_SMTP_KEY="your-brevo-smtp-key"
  # =============================================
  mail:
    host: smtp-relay.brevo.com
    port: 587
    username: ${BREVO_SMTP_USER:your-brevo-login-email@example.com}
    password: ${BREVO_SMTP_KEY:your-brevo-smtp-key}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        # Shorter timeouts prevent app hangs when SMTP is unreachable in dev
        connection-timeout: 5000
        timeout: 5000
        write-timeout: 5000

# =============================================
# JWT Configuration
# =============================================
jwt:
  secret: 3cfa76ef14937c1c0ea519f8fc057a80fcd04a7d34491023a944f4a4c1e6b9f2
  access-token-expiration-ms: 900000        # 15 minutes
  refresh-token-expiration-ms: 604800000    # 7 days

# =============================================
# App-Level Configuration
# =============================================
app:
  upload-dir: uploads/
  cors-allowed-origins: http://localhost:3000
  base-url: http://localhost:8080
  mail:
    from: no-reply@gonouniversity.edu.bd
    from-name: "GBJ — Gono Bishwabidyalay Journal"
    journal-url: http://localhost:3000

logging:
  level:
    org.springframework.security: DEBUG
    com.research.gbjournal: DEBUG
