# =============================================
# DEVELOPMENT PROFILE — H2 In-Memory Database
# =============================================
spring:
  datasource:
    url: jdbc:h2:mem:gbjournal_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop   # Schema is wiped and recreated on every restart
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Disable Docker Compose for dev (no Docker needed)
  docker:
    compose:
      enabled: false

# =============================================
# JWT Configuration
# =============================================
jwt:
  secret: 3cfa76ef14937c1c0ea519f8fc057a80fcd04a7d34491023a944f4a4c1e6b9f2
  access-token-expiration-ms: 900000        # 15 minutes
  refresh-token-expiration-ms: 604800000    # 7 days

# =============================================
# File Upload Configuration
# =============================================
app:
  upload-dir: uploads/
  cors-allowed-origins: http://localhost:3000
  base-url: http://localhost:8080

logging:
  level:
    org.springframework.security: DEBUG
    com.research.gbjournal: DEBUG

# =============================================
# Email / SMTP Configuration (Dev: Mailtrap)
# Sign up free at https://mailtrap.io and put
# your inbox credentials here.
# =============================================
spring:
  mail:
    host: sandbox.smtp.mailtrap.io
    port: 2525
    username: ${MAIL_USERNAME:your-mailtrap-username}
    password: ${MAIL_PASSWORD:your-mailtrap-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

app:
  mail:
    from: no-reply@gonouniversity.edu.bd
    from-name: "GBJ — Gono Bishwabidyalay Journal"
    journal-url: http://localhost:3000
