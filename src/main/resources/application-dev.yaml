# =============================================
# DEVELOPMENT PROFILE — H2 In-Memory Database
# =============================================
spring:
  datasource:
    url: jdbc:h2:mem:gbjournal_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop   # Schema is wiped and recreated on every restart
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Disable Docker Compose for dev (no Docker needed)
  docker:
    compose:
      enabled: false

logging:
  level:
    org.springframework.security: DEBUG
    com.research.gbjournal: DEBUG
