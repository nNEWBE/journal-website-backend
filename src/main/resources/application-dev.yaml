# =============================================
# DEVELOPMENT PROFILE — PostgreSQL Database
# All credentials & configs are loaded strictly from .env
# =============================================
spring:
  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update        # Creates tables and preserves seed data
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Disable Docker Compose for dev
  docker:
    compose:
      enabled: false

  # =============================================
  # Multipart file upload limits
  # =============================================
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 12MB
      file-size-threshold: 2KB

  # =============================================
  # Email SMTP Configuration (Loaded from .env)
  # =============================================
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        connection-timeout: 5000
        timeout: 5000
        write-timeout: 5000

# =============================================
# JWT Configuration
# =============================================
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: 86400000       # 24 hours (1 day)
  refresh-token-expiration-ms: 2592000000    # 30 days

# =============================================
# Cloudinary Image Storage (Loaded from .env)
# =============================================
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}
  folder: ${CLOUDINARY_FOLDER}

# =============================================
# App-Level Configuration (Loaded from .env)
# =============================================
app:
  upload-dir: ${UPLOAD_DIR}
  cors-allowed-origins: ${CORS_ORIGINS}
  base-url: ${APP_BASE_URL}
  mail:
    from: ${MAIL_FROM}
    from-name: ${MAIL_FROM_NAME}
    journal-url: ${JOURNAL_URL}

logging:
  level:
    org.springframework.security: DEBUG
    com.research.gbjournal: DEBUG
