# =============================================
# DEVELOPMENT PROFILE — Local PostgreSQL Database
# =============================================
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/gbjournal}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:shuvo1234}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update        # Creates tables and preserves seed data
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Disable Docker Compose for dev (no Docker needed)
  docker:
    compose:
      enabled: false

  # =============================================
  # Email SMTP — Brevo (Free: 300 emails/day)
  # https://app.brevo.com -> SMTP & API -> Generate SMTP Key
  # Set env vars before running:
  #   $env:BREVO_SMTP_USER="your-brevo-login-email@example.com"
  #   $env:BREVO_SMTP_KEY="your-brevo-smtp-key"
  # =============================================
  mail:
    host: smtp-relay.brevo.com
    port: 587
    username: ${BREVO_SMTP_USER:}
    password: ${BREVO_SMTP_KEY:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        # Shorter timeouts prevent app hangs when SMTP is unreachable in dev
        connection-timeout: 5000
        timeout: 5000
        write-timeout: 5000

# =============================================
# JWT Configuration
# =============================================
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: 900000        # 15 minutes
  refresh-token-expiration-ms: 604800000    # 7 days

# =============================================
# Cloudinary Image Storage
# =============================================
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  folder: gbjournal

# =============================================
# App-Level Configuration
# =============================================
app:
  upload-dir: uploads/
  cors-allowed-origins: http://localhost:3000
  base-url: http://localhost:8080
  mail:
    from: no-reply@gonouniversity.edu.bd
    from-name: "GBJ — Gono Bishwabidyalay Journal"
    journal-url: http://localhost:3000

logging:
  level:
    org.springframework.security: DEBUG
    com.research.gbjournal: DEBUG
