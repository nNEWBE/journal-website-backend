# =============================================
# PRODUCTION PROFILE — PostgreSQL + Brevo SMTP
# Activate with: --spring.profiles.active=prod
# =============================================
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/gbjournal}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME:gbjournal}
    password: ${DATABASE_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update        # Automatically create/update tables on cloud deploy
    show-sql: false

  docker:
    compose:
      enabled: false

  # =============================================
  # Brevo SMTP — Free 300 emails/day
  # Required env vars (set in server / container):
  #   BREVO_SMTP_USER  — your Brevo login email
  #   BREVO_SMTP_KEY   — your Brevo SMTP key
  # =============================================
  mail:
    host: smtp-relay.brevo.com
    port: 587
    username: ${BREVO_SMTP_USER}
    password: ${BREVO_SMTP_KEY}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        connection-timeout: 10000
        timeout: 10000
        write-timeout: 10000

# =============================================
# JWT — Use a strong 256-bit secret in prod!
# =============================================
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: 900000
  refresh-token-expiration-ms: 604800000

# =============================================
# Cloudinary Image Storage
# =============================================
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}
  folder: ${CLOUDINARY_FOLDER:gbjournal}

# =============================================
# App-Level Configuration
# =============================================
app:
  upload-dir: ${UPLOAD_DIR:/var/gbjournal/uploads/}
  cors-allowed-origins: ${CORS_ORIGINS:https://journal.gonouniversity.edu.bd}
  base-url: ${APP_BASE_URL:https://api.gonouniversity.edu.bd}
  mail:
    from: no-reply@gonouniversity.edu.bd
    from-name: "GBJ — Gono Bishwabidyalay Journal"
    journal-url: ${JOURNAL_URL:https://journal.gonouniversity.edu.bd}

logging:
  level:
    root: WARN
    com.research.gbjournal: INFO
