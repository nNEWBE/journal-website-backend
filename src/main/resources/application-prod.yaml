# =============================================
# PRODUCTION PROFILE — PostgreSQL + SMTP
# All credentials provided via environment variables
# =============================================
spring:
  datasource:
    url: ${DATABASE_URL:}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update        # Automatically create/update tables on cloud deploy
    show-sql: false
    properties:
      hibernate:
        default_batch_fetch_size: 25

  docker:
    compose:
      enabled: false

  # =============================================
  # Email SMTP Configuration (Loaded from environment)
  # =============================================
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            protocols: TLSv1.2 TLSv1.3
          from: ${MAIL_FROM:}
          localhost: ${SMTP_HELO_DOMAIN:gmail.com}
        connection-timeout: 10000
        timeout: 10000
        write-timeout: 10000

# =============================================
# JWT Configuration
# =============================================
jwt:
  secret: ${JWT_SECRET:}
  access-token-expiration-ms: 86400000       # 24 hours (1 day)
  refresh-token-expiration-ms: 2592000000    # 30 days

# =============================================
# Cloudinary Image Storage
# =============================================
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  folder: ${CLOUDINARY_FOLDER:}

# =============================================
# App-Level Configuration
# =============================================
app:
  upload-dir: ${UPLOAD_DIR:uploads/}
  cors-allowed-origins: ${CORS_ORIGINS:}
  base-url: ${APP_BASE_URL:}
  mail:
    from: ${MAIL_FROM:}
    from-name: ${MAIL_FROM_NAME:}
    journal-url: ${JOURNAL_URL:}
    reply-to: ${MAIL_REPLY_TO:}

logging:
  level:
    root: INFO
    com.research.gbjournal: INFO
    org.springframework.boot: INFO
