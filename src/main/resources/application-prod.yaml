# =============================================
# PRODUCTION PROFILE — PostgreSQL Database
# =============================================
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gbjournal}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:secret}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  h2:
    console:
      enabled: false  # Disable H2 console in production

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate   # Never auto-modify schema in production — use Flyway/Liquibase
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# Docker Compose disabled in prod (use a real DB server or managed service)
  docker:
    compose:
      enabled: false

logging:
  level:
    org.springframework.security: WARN
    com.research.gbjournal: INFO
