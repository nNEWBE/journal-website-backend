server:
  port: ${PORT:8080}

spring:
  application:
    name: gbjournal
  profiles:
    active: dev   # Change to 'prod' for production
  docker:
    compose:
      enabled: false  # Managed per profile

  servlet:
    multipart:
      enabled: true
      max-file-size: 25MB
      max-request-size: 30MB

app:
  supabase:
    url: ${SUPABASE_URL:}
    key: ${SUPABASE_KEY:}
    bucket: ${SUPABASE_BUCKET:manuscripts}

